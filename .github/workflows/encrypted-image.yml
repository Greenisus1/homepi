name: Build experimental encrypted HomePi image
on: workflow_dispatch
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential git wget cpio unzip rsync bc kmod xz-utils bzip2 file python3 perl libncurses-dev patch sed bison flex libssl-dev
      - name: Build optional encrypted image
        run: |
          git clone --depth 1 --branch 2025.08.1 https://github.com/buildroot/buildroot.git buildroot
          ./build-encrypted.sh
          xz -T2 buildroot/output/images/homepi-encrypted.img
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-homepi-encrypted
          path: buildroot/output/images/homepi-encrypted.img.xz
