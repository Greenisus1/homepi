name: Encrypted HomePi account tests
on: [push, pull_request]
jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest test_accounts test_authlib test_vaultlib -v
      - name: Shell and Python checks
        run: |
          bash -n build-encrypted.sh security/history.sh
          sh -n security/init
          sh -n security/install-target.sh
          sh -n security/post-image.sh
          python3 -m py_compile security/*.py
      - name: Real LUKS2 password rotation on a disposable file
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cryptsetup-bin genimage dosfstools mtools
          sudo env HOMEPI_RUN_LUKS_TESTS=1 python3 -m unittest test_luks_accounts -v
      - name: Validate encrypted image packaging with dummy firmware
        run: python3 -m unittest test_encrypted_packaging -v
      - name: Validate pinned Buildroot configuration
        run: |
          git clone --depth 1 --branch 2025.08.1 https://github.com/buildroot/buildroot.git buildroot
          ./build-encrypted.sh --configure-only
          python3 - <<'PY'
          from pathlib import Path
          config = Path('buildroot/.config').read_text()
          for option in ('BR2_PACKAGE_CRYPTSETUP=y', 'BR2_PACKAGE_LIBXCRYPT=y', 'BR2_PACKAGE_BASH=y', 'BR2_TARGET_ROOTFS_CPIO_GZIP=y', 'BR2_PACKAGE_E2FSPROGS=y', 'BR2_PACKAGE_PYTHON3_CURSES=y', '# BR2_TARGET_ENABLE_ROOT_LOGIN is not set'):
              assert option in config, option
          PY
