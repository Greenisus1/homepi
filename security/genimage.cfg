image homepi-encrypted-boot.vfat {
  vfat {
    extraargs = "-F 32"
    files = { #BOOT_FILES# }
  }
  size = 512M
}
image homepi-encrypted.img {
  hdimage { }
  partition boot {
    partition-type = 0x0C
    bootable = "true"
    image = "homepi-encrypted-boot.vfat"
  }
  partition encrypted-root {
    partition-type = 0x83
    size = 2G
  }
}
